plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.hilt)
    id 'kotlin-kapt'
    alias(libs.plugins.google.gms.google.services)
    alias(libs.plugins.google.firebase.crashlytics)
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

def properties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}
// CI передає ключ через env, локально — з local.properties
def mapsApiKey = System.getenv("MAPS_API_KEY") ?: properties.getProperty("MAPS_API_KEY") ?: ""

android {
    namespace 'com.k_office.app'
    compileSdk 36

    flavorDimensions += "environment"

    defaultConfig {
        applicationId "com.k_office.app"
        minSdk 24
        // Play з 31.08.2026 приймає оновлення лише з target API 36
        targetSdk 36
        versionCode 5
        versionName "1.1.8.4"

        manifestPlaceholders = [
                MAPS_API_KEY: mapsApiKey
        ]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(KOFFICE_RELEASE_STORE_FILE)
            storePassword KOFFICE_RELEASE_STORE_PASSWORD
            keyAlias KOFFICE_RELEASE_KEY_ALIAS
            keyPassword KOFFICE_RELEASE_KEY_PASSWORD
            storeType "JKS"
        }
    }

    productFlavors {
        create("dev") {
            dimension = "environment"
            buildConfigField("Boolean", "IS_DEV", "true")
            // Dev ходить на Render staging після переїзду з Cloud Run
            buildConfigField("String", "BASE_URL", "\"https://k-office-server-staging.onrender.com\"")
        }
        create("prod") {
            dimension = "environment"
            buildConfigField("Boolean", "IS_DEV", "false")
            buildConfigField("String", "BASE_URL", "\"https://k-office-445809650727.europe-west1.run.app\"")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            android.buildTypes.release.shrinkResources = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        // Не пакуємо baseline.prof — інакше adb install release падає на профілі
        resources {
            excludes += ["**/baseline.prof", "**/baseline.profm"]
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        abortOnError true
        checkDependencies true
        disable 'Instantiatable'
    }
}

secrets {
    propertiesFileName = "secrets.properties"
    defaultPropertiesFileName = "local.properties"
}

// Збирає prodRelease AAB і копіює в dist/ з номером версії
tasks.register("bundlePlay") {
    group = "publishing"
    description = "Зібрати підписаний prodRelease App Bundle для Play Console"
    dependsOn("bundleProdRelease")
    doLast {
        def aab = layout.buildDirectory.file("outputs/bundle/prodRelease/app-prod-release.aab").get().asFile
        def destDir = rootProject.file("dist")
        destDir.mkdirs()
        def dest = new File(
            destDir,
            "k-office-${android.defaultConfig.versionName}-${android.defaultConfig.versionCode}.aab"
        )
        dest.bytes = aab.bytes
        println "Play AAB: ${dest.absolutePath}"
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation libs.firebase.crashlytics
    implementation libs.firebase.messaging
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    implementation project(":presentation")
    implementation project(":data")

    implementation(libs.hilt.android)
    kapt(libs.hilt.compiler)

    // Timber
    implementation(libs.timber)

    // Coil
    implementation(libs.coil.compose)
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.0")

    // WorkManager
    implementation("androidx.work:work-runtime-ktx:2.9.0")
    implementation("androidx.hilt:hilt-work:1.0.0")
    kapt("androidx.hilt:hilt-compiler:1.0.0")

    implementation ("androidx.work:work-runtime-ktx:2.8.1")
}