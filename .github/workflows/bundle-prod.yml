name: Play Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > local.properties

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if raw.startswith("```"):
              raw = raw.strip("`")
              if raw.lower().startswith("json"):
                  raw = raw[4:].strip()
          if not raw:
              raise SystemExit("Secret GOOGLE_SERVICES_JSON is empty")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              data = json.loads(base64.b64decode(raw))
          if not isinstance(data, dict) or "project_info" not in data:
              raise SystemExit("google-services.json is invalid")
          pathlib.Path("app/google-services.json").write_text(
              json.dumps(data), encoding="utf-8"
          )
          print("google-services.json written")
          PY

      - name: Зібрати prodRelease AAB
        run: |
          chmod +x gradlew
          ./gradlew :app:bundlePlay --no-daemon

      - name: Зберегти AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 14
